<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Plain</title>
<style>
  :root { --bg: #000; --fg: #8a93a6; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; aspect-ratio: 2000 / 1333; }
  #status { position: fixed; left: 16px; bottom: 12px; font: 13px system-ui, sans-serif; opacity: .6; }
</style>
</head>
<body>
<canvas id="c" width="2000" height="1333"></canvas>
<div id="status"></div>
<script id="frag" type="x-shader/x-fragment">
/*@FRAG@*/
</script>
<script>
window.onerror = (m) => { window.__err = String(m); };
(() => {
  const params = new URLSearchParams(location.search);
  const W = +(params.get('w') || 2000), H = Math.round(W * 1333 / 2000);
  const SAMPLES = +(params.get('samples') || 16);
  const TILE = +(params.get('tile') || 160);
  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const status = document.getElementById('status');
  const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
  if (!gl) { status.textContent = 'WebGL2 is not available.'; return; }
  gl.getExtension('EXT_color_buffer_float');
  gl.getExtension('EXT_float_blend');
  const vs = `#version 300 es
  in vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
  function sh(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function prog(fsrc) {
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsrc));
    gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }
  const scene = prog(document.getElementById('frag').textContent.trim());
  const resolve = prog(`#version 300 es
  precision highp float; uniform sampler2D t; uniform float n; out vec4 o;
  float h(vec2 p){ vec3 q=fract(vec3(p.xyx)*.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
  void main(){ vec3 c = texelFetch(t, ivec2(gl_FragCoord.xy), 0).rgb / n;
    c = pow(clamp(c,0.,1.), vec3(1.0));
    c += (h(gl_FragCoord.xy) - 0.5) / 255.0;   // dither against banding in the dark sky
    o = vec4(c, 1.); }`);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, W, H, 0, gl.RGBA, gl.FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  // stratified jitter pattern (R2 sequence)
  const jit = i => [ (0.5 + i * 0.7548776662) % 1, (0.5 + i * 0.5698402910) % 1 ];
  const uRes = gl.getUniformLocation(scene, 'uRes'), uJ = gl.getUniformLocation(scene, 'uJitter');
  let s = 0, ty = 0;
  const t0 = performance.now();
  function step() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.useProgram(scene);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.enable(gl.SCISSOR_TEST);
    gl.uniform2f(uRes, W, H);
    const j = jit(s); gl.uniform2f(uJ, j[0], j[1]);
    gl.scissor(0, ty, W, TILE);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.disable(gl.SCISSOR_TEST); gl.disable(gl.BLEND);
    ty += TILE;
    if (ty >= H) { ty = 0; s++; present(); }
    if (s < SAMPLES) { status.textContent = `rendering pass ${s + 1} of ${SAMPLES}`; requestAnimationFrame(step); }
    else { status.textContent = ''; window.__done = true; window.__ms = performance.now() - t0; }
  }
  function present() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.useProgram(resolve);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(gl.getUniformLocation(resolve, 't'), 0);
    gl.uniform1f(gl.getUniformLocation(resolve, 'n'), s);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  step();
})();
</script>
</body>
</html>
